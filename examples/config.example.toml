insecure_skip_verify = false
# silence_creator = "on-call"

# Use config.example.yaml for vmagent/vmalert lists, connection-specific
# columns and search, or inline named Alerts views. Standalone named views
# in alert_views.d/*.yaml beside this file also work with TOML.

[general]
default_connection = "local"
history_limit = 1000

[query]
timeout = "30s"
default_range = "1h"
max_series = 500

[terminal]
program_status = true

[ui]
mouse = false # Set to true for clicking and wheel scrolling.

# Use a positive interval (e.g. "30s") to poll the open pane.
[auto_refresh]
alerts = "0s"
rules = "0s"
targets = "0s"
silences = "0s"
routing = "0s"

[[connections]]
name = "local"
url = "http://localhost:9090"
# alertmanager_url = "http://localhost:9093" # Alerts, Silences, and Routing

[[connections]]
name = "cluster"
url = "http://vmselect:8481/select/0/prometheus"
# alertmanager_url = "https://monitoring.example.org/alertmanager"
# insecure_skip_verify = false
