insecure_skip_verify: false
# silence_creator: on-call

general:
  default_connection: local
  history_limit: 1000

query:
  timeout: 30s
  default_range: 1h
  max_series: 500

terminal:
  program_status: true

ui:
  mouse: false # Set to true for clicking and wheel scrolling.

# Use a positive interval (e.g. 30s) to poll the open pane.
auto_refresh:
  alerts: 0s
  rules: 0s
  targets: 0s
  silences: 0s
  routing: 0s

# Available from Ctrl+O in Alerts. Extra layouts can live in alert_views.d/
# alongside this file, in .yaml files with a top-level `views:` mapping.
alerts:
  views:
    compact:
      columns:
        - {source: state, width: 11}
        - {source: labels.severity, width: 10}
        - {source: labels.alertname, title: Alert, weight: 2}
    certificates:
      columns:
        - {source: labels.alertname, title: Alert}
        - {source: labels.path, title: Certificate, weight: 2}
        - source: annotations.summary
          title: Expires in
          extract: 'expires in (.+?)\.?$'

connections:
  local:
    url: http://localhost:9090
    # alertmanager_url: http://localhost:9093 # Alerts, Silences, and Routing
