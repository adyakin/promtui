version: 2

project_name: promtui

builds:
  - main: ./cmd/promtui
    binary: promtui
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_arm64
      - linux_amd64_v1

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.txt
      - README.md
      - config.example.yaml
      - config.example.toml

checksum:
  name_template: checksums.txt
