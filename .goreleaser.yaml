version: 2

project_name: promtui

builds:
  - main: ./cmd/promtui
    binary: promtui
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_arm64
      - linux_amd64_v1

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE.txt
      - README.md
      - examples/*

checksum:
  name_template: checksums.txt
